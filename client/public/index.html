<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot Fleet Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>Robot Fleet Dashboard</h1>
  <div class="header-right">
    <span id="update-counter">Updates: 0</span>
    <span>
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Connecting…</span>
    </span>
  </div>
</header>

<div id="banner">Disconnected from relay — reconnecting…</div>

<main>
  <div class="arena-wrapper">
    <p class="section-label">Live Arena — 100 × 100 m</p>
    <canvas id="arena" width="500" height="500"></canvas>
  </div>

  <div class="cards-section">
    <p class="section-label">Robot Status</p>
    <div class="cards-grid" id="cards-grid"></div>
  </div>
</main>

<script>
  const ROBOT_COLORS = ['#818cf8', '#34d399', '#f472b6', '#fb923c', '#38bdf8'];

  let robots = [];
  let updateCount = 0;

  // ── Canvas ─────────────────────────────────────────────────────────────────
  const canvas = document.getElementById('arena');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  function toCanvas(x, y) {
    return [x / 100 * W, y / 100 * H];
  }

  function drawArena() {
    ctx.clearRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 10; i++) {
      const gx = i / 10 * W;
      const gy = i / 10 * H;
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
    }

    robots.forEach((r, i) => {
      const color = ROBOT_COLORS[i % ROBOT_COLORS.length];
      const [cx, cy] = toCanvas(r.position.x, r.position.y);
      const rad = r.heading * Math.PI / 180;

      // Glow
      const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, 20);
      grd.addColorStop(0, color + '35');
      grd.addColorStop(1, 'transparent');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(cx, cy, 20, 0, Math.PI * 2);
      ctx.fill();

      // Heading arrow
      const arrowEnd = 24;
      const ax = cx + Math.cos(rad) * arrowEnd;
      const ay = cy + Math.sin(rad) * arrowEnd;
      ctx.strokeStyle = color + 'bb';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(ax, ay);
      ctx.stroke();

      // Arrowhead
      const hl = 7;
      ctx.strokeStyle = color;
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(ax - hl * Math.cos(rad - 0.45), ay - hl * Math.sin(rad - 0.45));
      ctx.moveTo(ax, ay);
      ctx.lineTo(ax - hl * Math.cos(rad + 0.45), ay - hl * Math.sin(rad + 0.45));
      ctx.stroke();

      // Dot
      ctx.fillStyle = r.status === 'error' ? '#ef4444' : color;
      ctx.beginPath();
      ctx.arc(cx, cy, 7, 0, Math.PI * 2);
      ctx.fill();

      // Label
      ctx.fillStyle = '#f1f5f9';
      ctx.font = 'bold 10px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(r.id.replace('robot_', 'R'), cx, cy - 13);
    });
  }

  // ── Cards ──────────────────────────────────────────────────────────────────
  function batteryColor(pct) {
    if (pct < 20) return '#ef4444';
    if (pct < 50) return '#f59e0b';
    return '#22c55e';
  }

  function renderCards() {
    const grid = document.getElementById('cards-grid');

    robots.forEach((r, i) => {
      const color = ROBOT_COLORS[i % ROBOT_COLORS.length];
      let card = document.getElementById('card-' + r.id);

      if (!card) {
        card = document.createElement('div');
        card.id = 'card-' + r.id;
        card.className = 'robot-card';
        card.innerHTML = `
          <div class="card-header">
            <span class="robot-id" style="color:${color}">${r.id.replace('_', ' ').toUpperCase()}</span>
            <span class="status-badge" id="badge-${r.id}"></span>
          </div>
          <div class="battery-row">
            <span class="battery-label">Battery</span>
            <div class="battery-track"><div class="battery-fill" id="batt-${r.id}"></div></div>
            <span class="battery-pct" id="battpct-${r.id}"></span>
          </div>
          <div class="stats">
            <div class="stat">
              <span class="stat-label">Position</span>
              <span class="stat-value" id="pos-${r.id}"></span>
            </div>
            <div class="stat">
              <span class="stat-label">Heading</span>
              <span class="stat-value" id="hdg-${r.id}"></span>
            </div>
            <div class="stat">
              <span class="stat-label">Speed</span>
              <span class="stat-value" id="spd-${r.id}"></span>
            </div>
            <div class="stat">
              <span class="stat-label">Task</span>
              <span class="stat-value" id="tsk-${r.id}"></span>
            </div>
          </div>
          <div class="card-footer" id="ft-${r.id}"></div>
        `;
        grid.appendChild(card);
      }

      card.className = `robot-card status-${r.status}`;

      const badge = document.getElementById('badge-' + r.id);
      badge.textContent = r.status;
      badge.className = `status-badge badge-${r.status}`;

      const fill = document.getElementById('batt-' + r.id);
      fill.style.width = r.battery + '%';
      fill.style.backgroundColor = batteryColor(r.battery);
      document.getElementById('battpct-' + r.id).textContent = r.battery.toFixed(1) + '%';

      document.getElementById('pos-' + r.id).textContent = `(${r.position.x}, ${r.position.y})`;
      document.getElementById('hdg-' + r.id).textContent = r.heading + '°';
      document.getElementById('spd-' + r.id).textContent = r.speed + ' m/s';
      document.getElementById('tsk-' + r.id).textContent = r.task;
      document.getElementById('ft-' + r.id).textContent = 'Updated ' + new Date().toLocaleTimeString();
    });
  }

  // ── WebSocket ──────────────────────────────────────────────────────────────
  const dot        = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  const banner     = document.getElementById('banner');
  const counter    = document.getElementById('update-counter');

  function setConnected(ok) {
    dot.className = 'status-dot ' + (ok ? 'connected' : 'disconnected');
    statusText.textContent = ok ? 'Connected' : 'Disconnected';
    banner.style.display = ok ? 'none' : 'block';
  }

  function connect() {
    const ws = new WebSocket('ws://' + location.host);
    ws.onopen  = () => setConnected(true);
    ws.onclose = () => { setConnected(false); setTimeout(connect, 3000); };
    ws.onerror = () => ws.close();
    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type !== 'robot_update') return;
        robots = msg.robots;
        updateCount++;
        counter.textContent = 'Updates: ' + updateCount;
        drawArena();
        renderCards();
      } catch (_) {}
    };
  }

  connect();
</script>
</body>
</html>
